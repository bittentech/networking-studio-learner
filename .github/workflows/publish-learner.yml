name: Publish reviewed learner release

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: Check the release without publishing it
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: learner-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_owner == 'bittentech'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the reviewed draft and YouTube status
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/.github/scripts/publish_learner.py?ref=$GITHUB_SHA" \
            > "$RUNNER_TEMP/publish_learner.py"
          python3 "$RUNNER_TEMP/publish_learner.py"
